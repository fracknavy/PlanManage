name: Infrastructure Scan

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/**"
      - "docker-compose.yml"
      - "*.config.js"
      - "*.config.ts"
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/**"
      - "docker-compose.yml"
      - "*.config.js"
      - "*.config.ts"
  schedule:
    - cron: "0 0 * * 1" # Weekly on Monday

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload GitLeaks report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report/
          retention-days: 30

  iac-scan:
    name: IaC Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile,kubernetes,github_actions
          output_format: cli
          soft_fail: false

      - name: Upload Checkov report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-report
          path: checkov-report/
          retention-days: 30

  config-scan:
    name: Config Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Scan configuration files
        run: |
          # Check for hardcoded secrets
          if grep -r "password\|secret\|key\|token" --include="*.js" --include="*.ts" --include="*.json" .; then
            echo "Found potential hardcoded secrets"
            exit 1
          fi

      - name: Check environment variables
        run: |
          # Ensure all required env vars are documented
          if [ ! -f ".env.local.example" ]; then
            echo "Missing .env.local.example"
            exit 1
          fi

  permissions-scan:
    name: Permissions Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check GitHub Actions permissions
        uses: technote-space/ensure-actions-permissions@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
