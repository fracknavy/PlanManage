name: Internationalization

on:
  push:
    branches: [main, develop]
    paths:
      - "messages/**"
      - "src/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "messages/**"
      - "src/**"

jobs:
  validate-translations:
    name: Validate Translations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate translation files
        run: npm run i18n:validate

      - name: Check for missing translations
        run: npm run i18n:check

  extract-translations:
    name: Extract Translations
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Extract translations
        run: npm run i18n:extract

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(i18n): extract translations"
          title: "chore(i18n): extract translations"
          body: |
            This PR extracts new translation keys from the source code.

            Please review and merge.
          branch: chore/extract-translations
          labels: |
            i18n
            automated

  lint-translations:
    name: Lint Translations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint translation files
        run: npm run i18n:lint

  test-translations:
    name: Test Translations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test translations
        run: npm run i18n:test
