name: Database

on:
  push:
    branches: [main, develop]
    paths:
      - "prisma/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "prisma/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Database action"
        required: true
        default: "migrate"
        type: choice
        options:
          - migrate
          - seed
          - reset

jobs:
  validate-schema:
    name: Validate Schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Format Prisma schema
        run: npx prisma format

      - name: Check for changes
        run: |
          if git diff --quiet; then
            echo "No changes detected"
          else
            echo "Schema is not formatted"
            git diff
            exit 1
          fi

  migrate-staging:
    name: Migrate Staging
    runs-on: ubuntu-latest
    needs: validate-schema
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Send notification
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: "#database"
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  migrate-production:
    name: Migrate Production
    runs-on: ubuntu-latest
    needs: validate-schema
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Send notification
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: "#database"
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  seed-database:
    name: Seed Database
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'seed'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Seed database
        run: npm run db:seed
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

  reset-database:
    name: Reset Database
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'reset'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Reset database
        run: npx prisma migrate reset --force
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Seed database
        run: npm run db:seed
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
