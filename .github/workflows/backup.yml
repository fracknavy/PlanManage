name: Backup

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight
  workflow_dispatch:

jobs:
  backup-database:
    name: Backup Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create backup
        run: |
          pg_dump ${{ secrets.DATABASE_URL }} > backup_$(date +%Y%m%d_%H%M%S).sql
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_id }}
          path: backup_*.sql
          retention-days: 30

      - name: Send notification
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: "#backups"
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  backup-files:
    name: Backup Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create backup archive
        run: |
          tar -czf files-backup-${{ github.run_id }}.tar.gz \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=.git \
            .

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: files-backup-${{ github.run_id }}
          path: files-backup-*.tar.gz
          retention-days: 30

  cleanup-old-backups:
    name: Cleanup Old Backups
    runs-on: ubuntu-latest
    needs: [backup-database, backup-files]

    steps:
      - name: Cleanup old artifacts
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: "30 days"
          skip-tags: true

  restore-test:
    name: Restore Test
    runs-on: ubuntu-latest
    needs: backup-database

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: planmanage_restore_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Download backup
        uses: actions/download-artifact@v4
        with:
          name: database-backup-${{ github.run_id }}

      - name: Restore backup
        run: |
          psql -h localhost -U postgres -d planmanage_restore_test < backup_*.sql
        env:
          PGPASSWORD: postgres

      - name: Verify restore
        run: |
          psql -h localhost -U postgres -d planmanage_restore_test -c "SELECT COUNT(*) FROM \"User\";"
        env:
          PGPASSWORD: postgres

      - name: Send notification
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: "#alerts"
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
