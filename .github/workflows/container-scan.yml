name: Container Scan

on:
  push:
    branches: [main, develop]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
  schedule:
    - cron: "0 0 * * 1" # Weekly on Monday

jobs:
  build-image:
    name: Build Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t planmanage:${{ github.sha }} .

      - name: Save Docker image
        run: docker save planmanage:${{ github.sha }} > planmanage.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: planmanage.tar
          retention-days: 1

  trivy-scan:
    name: Trivy Scan
    runs-on: ubuntu-latest
    needs: build-image

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load < planmanage.tar

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "planmanage:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report/
          retention-days: 30

  snyk-container:
    name: Snyk Container
    runs-on: ubuntu-latest
    needs: build-image

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load < planmanage.tar

      - name: Run Snyk container test
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: "planmanage:${{ github.sha }}"
          args: --severity-threshold=high

  docker-bench:
    name: Docker Bench
    runs-on: ubuntu-latest
    needs: build-image

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load < planmanage.tar

      - name: Run Docker Bench
        uses: docker/docker-bench-security-action@v1

      - name: Upload Docker Bench report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-bench-report
          path: docker-bench-report/
          retention-days: 30

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
